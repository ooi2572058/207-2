<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出品物編集 - 書籍管理システム</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (アイコン) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        }

        main {
            flex: 1;
        }

        .navbar {
            background-color: #2c3e50 !important;
        }

        .card-custom {
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .card-header-custom {
            background-color: #2c3e50;
            color: #fff;
            font-weight: bold;
            border-radius: 10px 10px 0 0 !important;
        }

        .book-thumb {
            width: 55px;
            height: 70px;
            border-radius: 6px;
            object-fit: cover;
            background: linear-gradient(135deg, #34495e, #2c3e50);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.6rem;
            text-align: center;
            padding: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        }

        .footer {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <nav class="navbar navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-white" href="#">
                    <i class="fa-solid fa-book-open me-2 text-info"></i>書籍管理システム
                </a>
            </div>
        </nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card card-custom">
                        <div class="card-header card-header-custom py-3">
                            <h5 class="mb-0"><i class="fa-solid fa-pen-to-square me-2"></i>出品情報の編集</h5>
                        </div>
                        <div class="card-body p-4">

                            <!-- 案内メッセージ -->
                            <div class="alert alert-info border-info d-flex align-items-center mb-4" role="alert">
                                <i class="fa-solid fa-circle-info fa-2x me-3"></i>
                                <div>
                                    買い手がついた後は編集・削除ができなくなります。<br>
                                    修正事項がある場合は購入前にお手続きをお願いします。
                                </div>
                            </div>

                            <form>
                                <!-- 対象書籍の確認エリア -->
                                <div class="bg-light p-3 rounded border mb-4 d-flex align-items-center">
                                    <div class="book-thumb me-3">Java入門</div>
                                    <div>
                                        <span class="badge bg-secondary mb-1">管理ID: BK-00123</span>
                                        <h5 class="fw-bold text-dark mb-0 fs-6">Javaプログラミング入門 第2版</h5>
                                        <small class="text-muted">著者: 山田 太郎</small>
                                    </div>
                                </div>

                                <!-- 販売価格の変更 -->
                                <div class="mb-3">
                                    <label class="form-label fw-bold">販売価格 (円) <span
                                            class="badge bg-danger">必須</span></label>
                                    <div class="input-group input-group-lg">
                                        <span class="input-group-text">¥</span>
                                        <input type="number" class="form-control fw-bold" value="1200"
                                            placeholder="価格を入力">
                                    </div>
                                    <div class="form-text">相場や状態に合わせて価格を設定してください。</div>
                                </div>

                                <!-- 商品の状態 -->
                                <div class="mb-3">
                                    <label class="form-label fw-bold">商品の状態 <span
                                            class="badge bg-danger">必須</span></label>
                                    <select class="form-select">
                                        <option>新品・未使用に近い</option>
                                        <option selected>目立った傷や汚れなし</option>
                                        <option>やや傷や汚れあり (マーカー書き込み等あり)</option>
                                        <option>全体的に状態が悪い</option>
                                    </select>
                                </div>

                                <!-- 商品の説明・備考 -->
                                <div class="mb-3">
                                    <label class="form-label fw-bold">商品の説明・注意点（任意）</label>
                                    <textarea class="form-control" rows="4"
                                        placeholder="本の状態や書き込みの有無など">授業で一通り使用しましたが、カバーをかけていたため状態は綺麗です。書き込みや折り込みはありません。</textarea>
                                </div>

                                <!-- 受け渡し・発送方法 -->
                                <div class="mb-4">
                                    <label class="form-label fw-bold">受渡方法</label>
                                    <select class="form-select">
                                        <option selected>対面受渡（学内・手渡し）</option>
                                        <option>学内指定ロッカー受け渡し</option>
                                        <option>配送（送料出品者負担）</option>
                                    </select>
                                </div>

                                <!-- 確定・取り消しボタン -->
                                <div class="d-grid gap-2">
                                    <button type="button" class="btn btn-primary btn-lg fw-bold">
                                        <i class="fa-solid fa-floppy-disk me-2"></i>変更内容を保存する
                                    </button>
                                    <button type="button" class="btn btn-outline-danger">
                                        <i class="fa-solid fa-trash me-2"></i>この出品を取り下げる（削除）
                                    </button>
                                    <button type="button"
                                        class="btn btn-link text-secondary text-decoration-none text-center"
                                        onclick="history.back()">
                                        履歴一覧に戻る
                                    </button>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- フッター -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 書籍管理システム All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
