<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出品登録 | しょかんくん</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"><i class="fa-solid fa-book-open me-2"></i>しょかんくん</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link active" href="listing_new.html"><i class="fa-solid fa-pen-to-square me-1"></i>出品登録</a></li>
                        <li class="nav-item"><a class="nav-link" href="listing_list.html"><i class="fa-solid fa-list me-1"></i>出品一覧</a></li>
                        <li class="nav-item"><a class="nav-link" href="listing_history.html"><i class="fa-solid fa-clock-rotate-left me-1"></i>出品履歴</a></li>
                    </ul>
                    <form class="d-flex me-3" role="search">
                        <div class="input-group">
                            <input class="form-control form-control-sm" type="search" placeholder="ISBN・タイトル検索" aria-label="Search">
                            <button class="btn btn-outline-light btn-sm" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                        </div>
                    </form>
                    <ul class="navbar-nav">
                        <button type="button" class="btn btn-outline-info">ログイン</button>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-4">
        <div class="container">
            <h1 class="page-title">出品登録</h1>
            <p class="page-desc">品物を出品します。必要事項を入力してください。</p>

            <div class="card">
                <div class="card-header"><i class="fa-solid fa-box-open me-2"></i>出品する品物の情報</div>
                <div class="card-body">
                    <form action="listing_list.html" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="title" class="form-label">商品名（書籍タイトル） <span class="badge bg-danger">必須</span></label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="isbn" class="form-label">ISBN</label>
                                <input type="text" class="form-control" id="isbn" name="isbn" placeholder="978-4-...">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="author" class="form-label">著者</label>
                                <input type="text" class="form-control" id="author" name="author">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="category" class="form-label">カテゴリ</label>
                                <select class="form-select" id="category" name="category">
                                    <option value="">選択してください</option>
                                    <option>文学・小説</option>
                                    <option>技術書</option>
                                    <option>ビジネス</option>
                                    <option>漫画</option>
                                    <option>その他</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="condition" class="form-label">商品の状態</label>
                                <select class="form-select" id="condition" name="condition">
                                    <option>新品同様</option>
                                    <option>目立った傷や汚れなし</option>
                                    <option>やや傷や汚れあり</option>
                                    <option>傷や汚れあり</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="price" class="form-label">価格（円） <span class="badge bg-danger">必須</span></label>
                                <input type="number" class="form-control" id="price" name="price" min="0" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">商品説明</label>
                            <textarea class="form-control" id="description" name="description" rows="4"></textarea>
                        </div>
                        <div class="mb-4">
                            <label for="image" class="form-label">商品画像</label>
                            <input type="file" class="form-control" id="image" name="image" accept="image/*">
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-secondary-custom"><i class="fa-solid fa-check me-1"></i>出品する</button>
                            <a href="listing_list.html" class="btn btn-outline-secondary">キャンセル</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container text-center"><p class="mb-0">チーム開発書籍管理システム</p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
