<!DOCTYPE html>
<html lang="ja">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>評価登録完了 - 書籍管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
        }

        main {
            flex: 1;
        }

        .navbar {
            background-color: #2c3e50 !important;
        }

        .card-custom {
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .footer {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-white" href="#"><i
                        class="fa-solid fa-book-open me-2 text-info"></i>書籍管理システム</a>
            </div>
        </nav>
    </header>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 text-center">
                    <div class="card card-custom p-5">
                        <div class="mb-3 text-warning">
                            <i class="fa-solid fa-circle-check fa-4x"></i>
                        </div>
                        <h4 class="fw-bold mb-3">評価の登録が完了しました</h4>
                        <p class="text-muted mb-4">
                            ご回答ありがとうございます。<br>
                            投稿されたレビューは他のユーザーの選書参考に活用されます。
                        </p>
                        <div class="d-grid gap-2 col-8 mx-auto">
                            <button type="button" class="btn btn-outline-primary">トップ画面へ戻る</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 書籍管理システム All Rights Reserved.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
