<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購入リクエスト確認 - 書籍管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
        }

        main {
            flex: 1;
        }

        .navbar {
            background-color: #2c3e50 !important;
        }

        .card-custom {
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .card-header-custom {
            background-color: #2c3e50;
            color: #fff;
            font-weight: bold;
            border-radius: 10px 10px 0 0 !important;
        }

        .footer {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-white" href="#"><i
                        class="fa-solid fa-book-open me-2 text-info"></i>書籍管理システム</a>
            </div>
        </nav>
    </header>

    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7">
                    <div class="card card-custom">
                        <div class="card-header card-header-custom py-3">
                            <h5 class="mb-0"><i class="fa-solid fa-file-signature me-2"></i>購入リクエスト内容の確認</h5>
                        </div>
                        <div class="card-body p-4">
                            <!-- 未所蔵チェック完了通知 -->
                            <div class="alert alert-success d-flex align-items-center mb-4" role="alert">
                                <i class="fa-solid fa-circle-check me-2 fs-5"></i>
                                <div>この書籍は現在所蔵されていません。リクエストが可能です。</div>
                            </div>

                            <!-- リクエスト対象書籍の情報 -->
                            <div class="bg-light p-3 rounded border mb-4">
                                <div class="badge bg-secondary mb-1">ISBN: 9784798150000</div>
                                <h5 class="fw-bold text-dark mb-1">スッキリわかるJava入門 第3版</h5>
                                <p class="text-muted small mb-0">著者：中山 清喬 | 出版社：インプレス | 価格：¥2,860</p>
                            </div>

                            <!-- 申請フォーム -->
                            <form>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">リクエスト者名 <span
                                            class="badge bg-danger">必須</span></label>
                                    <input type="text" class="form-control form-control-lg" value="吉良 勇陽"
                                        placeholder="お名前を入力">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">購入理由・メモ（任意）</label>
                                    <textarea class="form-control" rows="3"
                                        placeholder="例: 授業の予習や実習課題の参考資料として利用したいため。"></textarea>
                                </div>

                                <div class="d-grid gap-2 mt-4">
                                    <button type="button" class="btn btn-primary btn-lg fw-bold">
                                        <i class="fa-solid fa-paper-plane me-2"></i>リクエストを確定する
                                    </button>
                                    <button type="button"
                                        class="btn btn-link text-secondary text-decoration-none text-center">一覧に戻る</button>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 書籍管理システム All Rights Reserved.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
