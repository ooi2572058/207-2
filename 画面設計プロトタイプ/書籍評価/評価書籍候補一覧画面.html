<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>評価書籍候補一覧 - 書籍管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
        }

        main {
            flex: 1;
        }

        .navbar {
            background-color: #2c3e50 !important;
        }

        .book-card {
            border-radius: 8px;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .footer {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-white" href="#"><i
                        class="fa-solid fa-book-open me-2 text-info"></i>書籍管理システム</a>
            </div>
        </nav>
    </header>

    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-9">

                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-list me-2"></i>所蔵書籍の検索結果（該当: 2件）</h5>

                    <!-- 所蔵されている書籍 1 -->
                    <div class="card book-card mb-3 p-3">
                        <div class="row align-items-center">
                            <div class="col-md-8">
                                <span class="badge bg-secondary mb-1">管理ID: BK-00123</span>
                                <h5 class="fw-bold mb-1">Javaプログラミング入門 第2版</h5>
                                <p class="text-muted small mb-0">著者：山田 太郎 | 保管場所：A棚 - 2段目</p>
                            </div>
                            <div class="col-md-4 text-md-end mt-2 mt-md-0">
                                <button type="button" class="btn btn-warning fw-bold text-dark"><i
                                        class="fa-solid fa-star me-1"></i>この本を評価する</button>
                            </div>
                        </div>
                    </div>

                    <!-- 所蔵されている書籍 2 -->
                    <div class="card book-card mb-4 p-3">
                        <div class="row align-items-center">
                            <div class="col-md-8">
                                <span class="badge bg-secondary mb-1">管理ID: BK-00456</span>
                                <h5 class="fw-bold mb-1">Java実践オブジェクト指向開発</h5>
                                <p class="text-muted small mb-0">著者：佐藤 健 | 保管場所：A棚 - 3段目</p>
                            </div>
                            <div class="col-md-4 text-md-end mt-2 mt-md-0">
                                <button type="button" class="btn btn-warning fw-bold text-dark"><i
                                        class="fa-solid fa-star me-1"></i>この本を評価する</button>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4">

                    <!-- 未所蔵（該当なし）の場合の表示サンプル -->
                    <div class="card card-body text-center p-4 bg-light border">
                        <div class="text-muted mb-2"><i class="fa-solid fa-folder-open fa-3x"></i></div>
                        <h5 class="fw-bold text-secondary mb-2">こちらの書籍は所蔵されていません</h5>
                        <p class="text-muted small mb-3">お探しの本が館内にない場合は、購入リクエストを出すことができます。</p>
                        <div>
                            <button type="button" class="btn btn-outline-primary"><i
                                    class="fa-solid fa-cart-plus me-1"></i>購入リクエスト画面へ進む</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 書籍管理システム All Rights Reserved.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
