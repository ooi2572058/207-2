<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>評価入力 - 書籍管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
        }

        main {
            flex: 1;
        }

        .navbar {
            background-color: #2c3e50 !important;
        }

        .card-custom {
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .card-header-custom {
            background-color: #2c3e50;
            color: #fff;
            font-weight: bold;
            border-radius: 10px 10px 0 0 !important;
        }

        /* 星評価ラジオボタンのスタイル */
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            font-size: 2rem;
        }

        .star-rating input {
            display: none;
        }

        .star-rating label {
            color: #ccc;
            cursor: pointer;
            padding: 0 0.1rem;
            transition: color 0.2s;
        }

        .star-rating label:hover,
        .star-rating label:hover~label,
        .star-rating input:checked~label {
            color: #ffc107;
        }

        .footer {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-white" href="#"><i
                        class="fa-solid fa-book-open me-2 text-info"></i>書籍管理システム</a>
            </div>
        </nav>
    </header>

    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7">
                    <div class="card card-custom">
                        <div class="card-header card-header-custom py-3">
                            <h5 class="mb-0"><i class="fa-solid fa-pen-to-square me-2"></i>評価・感想の入力</h5>
                        </div>
                        <div class="card-body p-4">

                            <!-- 対象書籍の概要 -->
                            <div class="bg-light p-3 rounded border mb-4">
                                <span class="badge bg-secondary mb-1">管理ID: BK-00123</span>
                                <h5 class="fw-bold mb-1">Javaプログラミング入門 第2版</h5>
                                <p class="text-muted small mb-0">著者：山田 太郎</p>
                            </div>

                            <form>
                                <!-- 評価者名 -->
                                <div class="mb-4">
                                    <label class="form-label fw-bold">評価者名 <span
                                            class="badge bg-danger">必須</span></label>
                                    <input type="text" class="form-control form-control-lg" placeholder="例: 吉良 勇陽"
                                        value="吉良 勇陽">
                                </div>

                                <!-- 5段階の星評価 -->
                                <div class="mb-4">
                                    <label class="form-label fw-bold d-block">評価 (5段階) <span
                                            class="badge bg-danger">必須</span></label>
                                    <div class="star-rating">
                                        <input type="radio" id="star5" name="rating" value="5" checked><label
                                            for="star5" title="5点"><i class="fa-solid fa-star"></i></label>
                                        <input type="radio" id="star4" name="rating" value="4"><label for="star4"
                                            title="4点"><i class="fa-solid fa-star"></i></label>
                                        <input type="radio" id="star3" name="rating" value="3"><label for="star3"
                                            title="3点"><i class="fa-solid fa-star"></i></label>
                                        <input type="radio" id="star2" name="rating" value="2"><label for="star2"
                                            title="2点"><i class="fa-solid fa-star"></i></label>
                                        <input type="radio" id="star1" name="rating" value="1"><label for="star1"
                                            title="1点"><i class="fa-solid fa-star"></i></label>
                                    </div>
                                </div>

                                <!-- 感想・レビュー（任意） -->
                                <div class="mb-4">
                                    <label class="form-label fw-bold">感想・レビュー <span
                                            class="badge bg-secondary">任意</span></label>
                                    <textarea class="form-control" rows="4"
                                        placeholder="例: 初心者にも分かりやすくまとめられており、基礎固めに役立ちました。">初心者にも分かりやすくまとめられており、実習でとても役立ちました。</textarea>
                                </div>

                                <!-- 確認ボタン -->
                                <div class="d-grid gap-2">
                                    <button type="button" class="btn btn-primary btn-lg fw-bold">
                                        確認画面へ進む <i class="fa-solid fa-arrow-right ms-1"></i>
                                    </button>
                                    <button type="button"
                                        class="btn btn-link text-secondary text-decoration-none text-center">キャンセル</button>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 書籍管理システム All Rights Reserved.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
