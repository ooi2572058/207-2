<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>評価内容確認 - 書籍管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
        }

        main {
            flex: 1;
        }

        .navbar {
            background-color: #2c3e50 !important;
        }

        .card-custom {
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .card-header-custom {
            background-color: #2c3e50;
            color: #fff;
            font-weight: bold;
            border-radius: 10px 10px 0 0 !important;
        }

        .star-text {
            color: #ffc107;
            font-size: 1.25rem;
        }

        .footer {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-white" href="#"><i
                        class="fa-solid fa-book-open me-2 text-info"></i>書籍管理システム</a>
            </div>
        </nav>
    </header>

    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7">
                    <div class="card card-custom">
                        <div class="card-header card-header-custom py-3">
                            <h5 class="mb-0"><i class="fa-solid fa-check-double me-2"></i>評価内容の確認</h5>
                        </div>
                        <div class="card-body p-4">

                            <!-- 対象書籍 -->
                            <div class="bg-light p-3 rounded border mb-4">
                                <span class="badge bg-secondary mb-1">管理ID: BK-00123</span>
                                <h5 class="fw-bold mb-1">Javaプログラミング入門 第2版</h5>
                                <p class="text-muted small mb-0">著者：山田 太郎</p>
                            </div>

                            <!-- 入力内容テーブル -->
                            <table class="table table-bordered mb-4">
                                <tbody>
                                    <tr>
                                        <th class="bg-light w-30" style="width: 30%;">評価者名</th>
                                        <td class="fw-bold">吉良 勇陽</td>
                                    </tr>
                                    <tr>
                                        <th class="bg-light">評価</th>
                                        <td>
                                            <span class="star-text me-2">★★★★★</span>
                                            <span class="fw-bold">5.0</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="bg-light">感想・レビュー</th>
                                        <td style="white-space: pre-wrap;">初心者にも分かりやすくまとめられており、実習でとても役立ちました。</td>
                                    </tr>
                                </tbody>
                            </table>

                            <!-- 確定ボタン -->
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-success btn-lg fw-bold">
                                    <i class="fa-solid fa-paper-plane me-2"></i>この内容で評価を登録する
                                </button>
                                <button type="button" class="btn btn-outline-secondary">修正する（戻る）</button>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 書籍管理システム All Rights Reserved.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
