<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メール送信完了 - しょかんくん</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --bg-light: #f8f9fa;
        }

        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar {
            background-color: var(--primary-color) !important;
        }

        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
        }

        .footer {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-white" href="#">
                    <i class="fa-solid fa-book-open me-2 text-info"></i>しょかんくん
                </a>
            </div>
        </nav>
    </header>

    <main class="py-5">
        <div class="container d-flex justify-content-center">
            <div class="card card-custom p-4 bg-white text-center">
                <div class="text-primary mb-3">
                    <i class="fa-paper-plane fa-solid fa-3x"></i>
                </div>
                <h4 class="fw-bold text-dark mb-3">再設定用メールを送信しました</h4>
                <p class="text-muted small mb-4">
                    ご入力いただいたメールアドレス宛に、パスワード再設定用リンクを記載した案内メールを送信しました。<br>
                    メール内のリンクをクリックし、30分以内に新しいパスワードを設定してください。
                </p>
                <div class="alert alert-light border small text-start mb-4">
                    <i class="fa-circle-info fa-solid text-info me-1"></i> <strong>メールが届かない場合</strong>
                    <ul class="mb-0 ps-3 mt-1 text-muted">
                        <li>迷惑メールフォルダに分類されていないかご確認ください。</li>
                        <li>メールアドレスのお間違いがないかご確認の上、再度お試しください。</li>
                    </ul>
                </div>
                <div class="d-grid gap-2">
                    <a href="login.html" class="btn btn-outline-secondary">ログイン画面へ戻る</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 チーム開発書籍管理システム しょかんくん</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
