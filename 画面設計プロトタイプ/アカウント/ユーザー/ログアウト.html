<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログアウト完了 - しょかんくん</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (アイコン) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #18bc9c;
            --bg-light: #f8f9fa;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar {
            background-color: var(--primary-color) !important;
        }

        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 440px;
        }

        .logout-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #e8f8f5;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
        }

        .footer {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 1.5rem 0;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <nav class="navbar navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold text-white" href="#">
                    <i class="fa-solid fa-book-open me-2 text-info"></i>しょかんくん
                </a>
            </div>
        </nav>
    </header>

    <!-- メインコンテンツ（中央配置） -->
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 d-flex justify-content-center">

                    <div class="card card-custom p-4 bg-white text-center">

                        <!-- 完了アイコン -->
                        <div class="logout-icon">
                            <i class="fa-solid fa-check fa-2x"></i>
                        </div>

                        <h4 class="fw-bold text-dark mb-3">ログアウトしました</h4>
                        <p class="text-muted small mb-4">
                            ご利用ありがとうございました。<br>
                            セキュリティ保護のため、共有端末をお使いの場合はブラウザを閉じることをおすすめします。
                        </p>

                        <!-- 再ログインボタン -->
                        <div class="d-grid gap-2">
                            <a href="login.html" class="btn btn-primary fw-bold py-2">
                                <i class="fa-solid fa-right-to-bracket me-2"></i>再度ログインする
                            </a>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- フッター -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 チーム開発書籍管理システム しょかんくん</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
