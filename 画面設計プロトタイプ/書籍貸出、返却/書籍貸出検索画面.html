<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貸出予定書籍検索画面 - 書籍管理システム</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (アイコン) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        }

        main {
            flex: 1;
        }

        .navbar {
            background-color: #2c3e50 !important;
        }

        .search-card {
            border-radius: 8px;
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }

        .search-card .card-header {
            background-color: #2c3e50 !important;
            color: #ffffff;
            font-weight: bold;
        }

        .table-responsive {
            border-radius: 0 0 8px 8px;
            overflow: hidden;
        }

        .table th {
            background-color: #f1f3f5;
            color: #495057;
            font-size: 0.875rem;
        }

        .table td {
            vertical-align: middle;
        }

        .badge-id {
            background-color: #6c757d;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .footer {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <nav class="navbar navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-white" href="#">
                    <i class="fa-solid fa-book-open me-2 text-info"></i>書籍管理システム
                </a>
            </div>
        </nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <!-- 検索フォーム -->
                    <div class="card search-card mb-4">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="fa-solid fa-magnifying-glass me-2"></i>貸出・返却する書籍の検索</h5>
                        </div>
                        <div class="card-body">
                            <form>
                                <div class="row g-3">
                                    <div class="col-md-5">
                                        <label class="form-label fw-bold">書籍タイトル</label>
                                        <input type="text" class="form-control" placeholder="例: Javaプログラミング入門">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-bold">管理ID / ISBN</label>
                                        <input type="text" class="form-control" placeholder="例: BK-00123 または ISBN">
                                    </div>
                                    <div class="col-md-3 d-flex align-items-end">
                                        <button type="button" class="btn btn-primary w-100">
                                            <i class="fa-solid fa-search me-1"></i>検索する
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- 検索結果一覧 -->
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white">
                            <h6 class="mb-0 text-muted">検索結果 (該当: 2件)</h6>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead>
                                        <tr>
                                            <th>管理ID</th>
                                            <th>タイトル</th>
                                            <th>保管場所</th>
                                            <th>現在の状態</th>
                                            <th class="text-center">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td><span class="badge badge-id">BK-00123</span></td>
                                            <td><strong>Javaプログラミング入門 第2版</strong></td>
                                            <td>A棚 - 2段目</td>
                                            <td><span class="badge bg-success">貸出可能</span></td>
                                            <td class="text-center">
                                                <button type="button"
                                                    class="btn btn-sm btn-outline-primary">選択する</button>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td><span class="badge badge-id">BK-00124</span></td>
                                            <td><strong>Webデザイン完全ガイド</strong></td>
                                            <td>B棚 - 1段目</td>
                                            <td><span class="badge bg-warning text-dark">貸出中 (山田)</span></td>
                                            <td class="text-center">
                                                <button type="button"
                                                    class="btn btn-sm btn-outline-success">返却手続き</button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- フッター -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 書籍管理システム All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
