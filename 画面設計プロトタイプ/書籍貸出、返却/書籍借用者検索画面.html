<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貸出借用者検索画面 - 書籍管理システム</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (アイコン) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        }

        main {
            flex: 1;
        }

        .navbar {
            background-color: #2c3e50 !important;
        }

        .form-card {
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            border: none;
        }

        .form-card .card-header {
            background-color: #2c3e50;
            color: #ffffff;
            font-weight: bold;
        }

        .selected-book-summary {
            background-color: #eef2f7;
            border-left: 4px solid #3498db;
            padding: 0.85rem 1rem;
            border-radius: 4px;
        }

        .form-label {
            color: #2c3e50;
            margin-bottom: 0.4rem;
        }

        .form-control:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25);
        }

        .footer {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <nav class="navbar navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-white" href="#">
                    <i class="fa-solid fa-book-open me-2 text-info"></i>書籍管理システム
                </a>
            </div>
        </nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card form-card">
                        <div class="card-header py-3">
                            <h5 class="mb-0"><i class="fa-solid fa-user-pen me-2"></i>貸出情報の入力</h5>
                        </div>
                        <div class="card-body p-4">
                            <!-- 選択中の書籍ミニ情報 -->
                            <div class="selected-book-summary mb-4">
                                <div class="fw-bold text-dark">Javaプログラミング入門 第2版</div>
                                <small class="text-muted">管理ID: BK-00123 | 保管場所: A棚 - 2段目</small>
                            </div>

                            <form>
                                <!-- 借用者名入力 -->
                                <div class="mb-3">
                                    <label for="borrower_name" class="form-label fw-bold">借用者名 <span
                                            class="badge bg-danger">必須</span></label>
                                    <input type="text" class="form-control form-control-lg" id="borrower_name"
                                        placeholder="例: 吉良 勇陽">
                                    <div class="form-text">身内メンバーの名前またはニックネームを入力してください。</div>
                                </div>

                                <!-- 貸出日 -->
                                <div class="mb-3">
                                    <label for="loan_date" class="form-label fw-bold">貸出日</label>
                                    <input type="date" class="form-control" id="loan_date" value="2026-10-08">
                                </div>

                                <!-- 確定ボタン -->
                                <div class="d-grid gap-2 mt-4">
                                    <button type="button" class="btn btn-primary btn-lg">
                                        <i class="fa-solid fa-check me-2"></i>貸出を確定する
                                    </button>
                                    <button type="button"
                                        class="btn btn-link text-secondary text-decoration-none text-center">戻る</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- フッター -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 書籍管理システム All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
