<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書籍情報変更処理 | しょかんくん管理者</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --admin-color: #c0392b;
            --bg-light: #f8f9fa;
        }

        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .navbar-admin {
            background-color: var(--admin-color) !important;
        }

        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .footer {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-dark navbar-admin">
            <div class="container">
                <a class="navbar-brand fw-bold text-white" href="#"><i
                        class="fa-solid fa-user-shield me-2"></i>しょかんくん【管理者】</a>
                <span class="text-white small fw-bold"><i class="fa-solid fa-pen-to-square me-1"></i>書籍情報変更</span>
            </div>
        </nav>
    </header>

    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-7">

                    <!-- 【ステップ1：変更内容入力】 -->
                    <div id="step-process" class="card card-custom p-4 bg-white">
                        <h4 class="fw-bold text-dark text-center mb-1"><i
                                class="fa-solid fa-pen-to-square me-2 text-primary"></i>書籍情報の変更</h4>
                        <p class="text-muted small text-center mb-4">ISBN: 9784876543210 の登録内容を編集します。</p>

                        <form id="editForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold small">タイトル名 <span
                                        class="badge bg-danger">必須</span></label>
                                <input type="text" id="editTitle" class="form-control" value="Webデザイン完全ガイド 第3版">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small">表紙写真の変更</label>
                                <input type="file" id="editImage" class="form-control form-control-sm" accept="image/*">
                                <div class="form-text">変更しない場合は未選択のままにしてください。</div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold small">備考（書籍概要・特記事項）</label>
                                <textarea id="editNote" class="form-control"
                                    rows="3">最新のCSSフレームワークとアクセシビリティに対応した改訂版テキストです。</textarea>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-primary fw-bold py-2" onclick="showConfirm()">
                                    <i class="fa-solid fa-eye me-2"></i>変更内容のプレビュー確認へ
                                </button>
                                <a href="admin_book_edit_search.html" class="btn btn-outline-secondary">キャンセル</a>
                            </div>
                        </form>
                    </div>

                    <!-- 【ステップ2：プレビュー確認画面】 -->
                    <div id="step-confirm" class="card card-custom p-4 bg-white d-none">
                        <div class="text-center mb-3">
                            <span class="badge bg-primary px-3 py-2 mb-2 fs-6">プレビュー</span>
                            <h4 class="fw-bold text-dark">以下の内容で更新しますか？</h4>
                        </div>

                        <div class="border rounded p-3 mb-4 bg-light">
                            <h6 class="fw-bold text-primary border-bottom pb-2 mb-3"><i
                                    class="fa-solid fa-check me-2"></i>変更後の登録情報</h6>
                            <table class="table table-sm table-borderless small mb-0">
                                <tr>
                                    <th class="text-muted" style="width:30%;">タイトル名：</th>
                                    <td class="fw-bold text-dark" id="previewTitle">-</td>
                                </tr>
                                <tr>
                                    <th class="text-muted">ISBNコード：</th>
                                    <td>9784876543210</td>
                                </tr>
                                <tr>
                                    <th class="text-muted">表紙写真：</th>
                                    <td id="previewImageText">既存の表紙写真を保持</td>
                                </tr>
                                <tr>
                                    <th class="text-muted">備考：</th>
                                    <td id="previewNote" class="text-break">-</td>
                                </tr>
                            </table>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-success fw-bold py-2" onclick="goToStep('complete')">
                                <i class="fa-solid fa-floppy-disk me-2"></i>この内容で保存・更新する
                            </button>
                            <button type="button" class="btn btn-outline-secondary"
                                onclick="goToStep('process')">修正する</button>
                        </div>
                    </div>

                    <!-- 【ステップ3：更新完了画面】 -->
                    <div id="step-complete" class="card card-custom p-5 bg-white text-center d-none">
                        <div class="text-success mb-3"><i class="fa-solid fa-circle-check fa-4x"></i></div>
                        <h4 class="fw-bold text-dark mb-3">更新が完了しました</h4>
                        <p class="text-muted small mb-4">書籍情報が正しく更新されました。<br>検索結果・詳細画面にも即座に反映されます。</p>
                        <a href="admin_book_edit_search.html" class="btn btn-primary fw-bold px-4">続けて別の書籍を編集する</a>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 チーム開発書籍管理システム しょかんくん</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showConfirm() {
            const title = document.getElementById('editTitle').value;
            const note = document.getElementById('editNote').value;
            const imageFile = document.getElementById('editImage').files[0];

            document.getElementById('previewTitle').innerText = title || '(未入力)';
            document.getElementById('previewNote').innerText = note || '(なし)';
            document.getElementById('previewImageText').innerText = imageFile ? '新しい画像に更新: ' + imageFile.name : '既存の表紙写真を保持';

            goToStep('confirm');
        }

        function goToStep(step) {
            document.getElementById('step-process').classList.add('d-none');
            document.getElementById('step-confirm').classList.add('d-none');
            document.getElementById('step-complete').classList.add('d-none');
            document.getElementById('step-' + step).classList.remove('d-none');
        }
    </script>
</body>

</html>
