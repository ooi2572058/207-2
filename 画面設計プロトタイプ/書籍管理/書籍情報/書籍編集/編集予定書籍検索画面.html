<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書籍編集 - 対象検索 | しょかんくん管理者</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --admin-color: #c0392b;
            --bg-light: #f8f9fa;
        }

        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar-admin {
            background-color: var(--admin-color) !important;
        }

        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 520px;
        }

        .footer {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-dark navbar-admin">
            <div class="container">
                <a class="navbar-brand fw-bold text-white" href="#"><i
                        class="fa-solid fa-user-shield me-2"></i>しょかんくん【管理者】</a>
                <span class="text-white small fw-bold"><i class="fa-solid fa-pen-to-square me-1"></i>書籍情報変更</span>
            </div>
        </nav>
    </header>

    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 d-flex justify-content-center">
                    <div class="card card-custom p-4 bg-white">
                        <div class="text-center mb-4">
                            <h4 class="fw-bold text-dark"><i
                                    class="fa-solid fa-file-pen me-2 text-primary"></i>編集対象書籍の検索</h4>
                            <p class="text-muted small mb-0">情報を変更・更新したい書籍を検索します。<br>タイトル名またはISBNコードを入力してください。</p>
                        </div>

                        <form action="admin_book_edit_process.html" method="get">
                            <div class="mb-3">
                                <label class="form-label fw-bold small">タイトル名</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-heading"></i></span>
                                    <input type="text" name="title" class="form-control" placeholder="例：Webデザイン完全ガイド">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold small">ISBNコード</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-barcode"></i></span>
                                    <input type="text" name="isbn" class="form-control" placeholder="例：9784876543210">
                                </div>
                            </div>

                            <div class="d-grid gap-2 mb-3">
                                <button type="submit" class="btn btn-primary fw-bold py-2">
                                    <i class="fa-solid fa-magnifying-glass me-2"></i>編集対象を検索する
                                </button>
                                <a href="home_admin.html" class="btn btn-outline-secondary">管理者ホームに戻る</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 チーム開発書籍管理システム しょかんくん</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
