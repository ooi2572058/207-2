<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メモ登録・編集 | しょかんくん管理者</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --admin-color: #c0392b;
            --bg-light: #f8f9fa;
        }

        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .navbar-admin {
            background-color: var(--admin-color) !important;
        }

        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .footer {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-dark navbar-admin">
            <div class="container">
                <a class="navbar-brand fw-bold text-white" href="#"><i
                        class="fa-solid fa-user-shield me-2"></i>しょかんくん【管理者】</a>
                <span class="text-white small fw-bold"><i class="fa-solid fa-note-sticky me-1"></i>メモ入力</span>
            </div>
        </nav>
    </header>

    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-7">

                    <!-- 【ステップ1：メモ入力】 -->
                    <div id="step-process" class="card card-custom p-4 bg-white">
                        <h4 class="fw-bold text-dark text-center mb-1"><i
                                class="fa-solid fa-pen me-2 text-warning"></i>書籍メモの入力</h4>
                        <p class="text-muted small text-center mb-4">対象書籍: SQL & DB基本のきほん (ISBN: 9784999999999)</p>

                        <form id="memoForm">
                            <!-- 状態区分タグ選択 -->
                            <div class="mb-3">
                                <label class="form-label fw-bold small">状態区分 <span
                                        class="badge bg-danger">必須</span></label>
                                <select id="memoType" class="form-select">
                                    <option value="破損">破損（ページ破れ・水濡れ等）</option>
                                    <option value="不備">不備（乱丁・帯なし・付属DVD欠品等）</option>
                                    <option value="紛失">紛失（所在不明）</option>
                                    <option value="その他">その他特記事項</option>
                                </select>
                            </div>

                            <!-- メモ本文 -->
                            <div class="mb-4">
                                <label class="form-label fw-bold small">メモ詳細・状態内容 <span
                                        class="badge bg-danger">必須</span></label>
                                <textarea id="memoText" class="form-control" rows="4"
                                    placeholder="具体的な状況や発見日、対応予定などを記入してください。">カバー背表紙部分に大きな破損あり。貸出停止とし保管場所B-2へ移動済み。</textarea>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-warning fw-bold py-2 text-dark"
                                    onclick="showConfirm()">
                                    <i class="fa-solid fa-eye me-2"></i>入力内容をプレビュー確認
                                </button>
                                <a href="admin_memo_search.html" class="btn btn-outline-secondary">戻る</a>
                            </div>
                        </form>
                    </div>

                    <!-- 【ステップ2：プレビュー確認画面】 -->
                    <div id="step-confirm" class="card card-custom p-4 bg-white d-none">
                        <div class="text-center mb-3">
                            <span class="badge bg-warning text-dark px-3 py-2 mb-2 fs-6">メモプレビュー</span>
                            <h4 class="fw-bold text-dark">この内容でメモを登録しますか？</h4>
                        </div>

                        <div class="border rounded p-3 mb-4 bg-light">
                            <h6 class="fw-bold text-dark border-bottom pb-2 mb-3"><i
                                    class="fa-solid fa-bookmark me-2 text-warning"></i>メモ登録内容</h6>
                            <table class="table table-sm table-borderless small mb-0">
                                <tr>
                                    <th class="text-muted" style="width:30%;">対象書籍：</th>
                                    <td class="fw-bold">SQL & DB基本のきほん</td>
                                </tr>
                                <tr>
                                    <th class="text-muted">ISBN：</th>
                                    <td>9784999999999</td>
                                </tr>
                                <tr>
                                    <th class="text-muted">状態区分：</th>
                                    <td><span class="badge bg-danger fs-6" id="previewType">-</span></td>
                                </tr>
                                <tr>
                                    <th class="text-muted">メモ本文：</th>
                                    <td id="previewText" class="text-break fw-bold text-dark">-</td>
                                </tr>
                            </table>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-primary fw-bold py-2" onclick="goToStep('complete')">
                                <i class="fa-solid fa-check me-2"></i>確定してメモを保存する
                            </button>
                            <button type="button" class="btn btn-outline-secondary"
                                onclick="goToStep('process')">修正する</button>
                        </div>
                    </div>

                    <!-- 【ステップ3：完了画面】 -->
                    <div id="step-complete" class="card card-custom p-5 bg-white text-center d-none">
                        <div class="text-success mb-3"><i class="fa-solid fa-circle-check fa-4x"></i></div>
                        <h4 class="fw-bold text-dark mb-3">メモを登録しました</h4>
                        <p class="text-muted small mb-4">メモが正常に保存されました。<br>「メモのある書籍一覧」からいつでも状態を確認できます。</p>
                        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                            <a href="admin_memo_list.html" class="btn btn-primary fw-bold px-4">メモのある書籍一覧を見る</a>
                            <a href="admin_memo_search.html" class="btn btn-outline-secondary px-4">続けて検索する</a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 チーム開発書籍管理システム しょかんくん</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showConfirm() {
            const type = document.getElementById('memoType').value;
            const text = document.getElementById('memoText').value;

            document.getElementById('previewType').innerText = type;
            document.getElementById('previewText').innerText = text || '(未入力)';

            goToStep('confirm');
        }

        function goToStep(step) {
            document.getElementById('step-process').classList.add('d-none');
            document.getElementById('step-confirm').classList.add('d-none');
            document.getElementById('step-complete').classList.add('d-none');
            document.getElementById('step-' + step).classList.remove('d-none');
        }
    </script>
</body>

</html>
