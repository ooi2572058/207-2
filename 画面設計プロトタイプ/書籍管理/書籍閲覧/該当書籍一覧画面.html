<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検索結果一覧 - しょかんくん</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (アイコン) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #18bc9c;
            --bg-light: #f8f9fa;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .navbar {
            background-color: var(--primary-color) !important;
        }

        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s;
        }

        .card-custom:hover {
            transform: translateY(-3px);
        }

        /* 書籍サムネイル */
        .book-thumb {
            width: 100%;
            height: 180px;
            border-radius: 6px;
            background: linear-gradient(135deg, #34495e, #2c3e50);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.9rem;
            text-align: center;
            padding: 10px;
        }

        .footer {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <nav class="navbar navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-white" href="#">
                    <i class="fa-solid fa-book-open me-2 text-info"></i>しょかんくん
                </a>
                <span class="text-white small fw-bold"><i class="fa-solid fa-bookmark me-1 text-info"></i>個人蔵書検索</span>
            </div>
        </nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="py-4">
        <div class="container">

            <!-- ヘッダーバー（条件と件数） -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold text-dark mb-0">
                    <i class="fa-solid fa-list-check me-2 text-primary"></i>検索結果一覧
                    <span class="badge bg-primary fs-6 ms-2">3 件該当</span>
                </h5>
                <a href="personal_search.html" class="btn btn-outline-secondary btn-sm">
                    <i class="fa-solid fa-arrow-left me-1"></i>条件を変更して再検索
                </a>
            </div>

            <!-- 検索条件サマリー -->
            <div class="alert alert-info py-2 small mb-4">
                <i class="fa-solid fa-filter me-1"></i> 検索条件：タイトル「Java」 / ジャンル「IT・技術書」
            </div>

            <!-- 書籍カード一覧（該当あり） -->
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">

                <!-- 書籍 1 -->
                <div class="col">
                    <div class="card card-custom h-100 p-3 bg-white">
                        <div class="book-thumb mb-3">Javaプログラミング入門</div>
                        <h6 class="fw-bold text-dark mb-1 text-truncate">Javaプログラミング入門 第2版</h6>
                        <p class="small text-muted mb-2">著者：山田太郎 / 出版：技術出版</p>
                        <span class="badge bg-light text-dark border mb-3 w-auto align-self-start">IT・技術書</span>
                        <div class="mt-auto">
                            <a href="book_detail.html" class="btn btn-outline-primary btn-sm w-100 fw-bold">
                                <i class="fa-solid fa-circle-info me-1"></i>書籍詳細を見る
                            </a>
                        </div>
                    </div>
                </div>

                <!-- 書籍 2 -->
                <div class="col">
                    <div class="card card-custom h-100 p-3 bg-white">
                        <div class="book-thumb mb-3" style="background: linear-gradient(135deg, #18bc9c, #128f76);">
                            スッキリわかるJava実践</div>
                        <h6 class="fw-bold text-dark mb-1 text-truncate">スッキリわかるJava実践編</h6>
                        <p class="small text-muted mb-2">著者：佐藤次郎 / 出版：学びブックス</p>
                        <span class="badge bg-light text-dark border mb-3 w-auto align-self-start">IT・技術書</span>
                        <div class="mt-auto">
                            <a href="book_detail.html" class="btn btn-outline-primary btn-sm w-100 fw-bold">
                                <i class="fa-solid fa-circle-info me-1"></i>書籍詳細を見る
                            </a>
                        </div>
                    </div>
                </div>

                <!-- 書籍 3 -->
                <div class="col">
                    <div class="card card-custom h-100 p-3 bg-white">
                        <div class="book-thumb mb-3" style="background: linear-gradient(135deg, #8e44ad, #9b59b6);">
                            Java高度オブジェクト指向</div>
                        <h6 class="fw-bold text-dark mb-1 text-truncate">Java高度オブジェクト指向設計</h6>
                        <p class="small text-muted mb-2">著者：鈴木一郎 / 出版：コード出版</p>
                        <span class="badge bg-light text-dark border mb-3 w-auto align-self-start">IT・技術書</span>
                        <div class="mt-auto">
                            <a href="book_detail.html" class="btn btn-outline-primary btn-sm w-100 fw-bold">
                                <i class="fa-solid fa-circle-info me-1"></i>書籍詳細を見る
                            </a>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- フッター -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 チーム開発書籍管理システム しょかんくん</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
