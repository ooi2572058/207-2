<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人書籍検索 - しょかんくん</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (アイコン) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #18bc9c;
            --bg-light: #f8f9fa;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar {
            background-color: var(--primary-color) !important;
        }

        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
        }

        .footer {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 1.5rem 0;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <nav class="navbar navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-white" href="#">
                    <i class="fa-solid fa-book-open me-2 text-info"></i>しょかんくん
                </a>
                <span class="text-white small fw-bold"><i class="fa-solid fa-bookmark me-1 text-info"></i>個人蔵書検索</span>
            </div>
        </nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">

                    <div class="card card-custom p-4 bg-white mx-auto">
                        <div class="text-center mb-4">
                            <h4 class="fw-bold text-dark"><i
                                    class="fa-solid fa-book-bookmark me-2 text-primary"></i>個人所有 書籍検索</h4>
                            <p class="text-muted small mb-0">あなたが所有している蔵書から書籍を検索します。<br>いずれか1つ以上の条件を入力・選択してください。</p>
                        </div>

                        <form action="personal_search_result.html" method="get">
                            <!-- タイトル名 -->
                            <div class="mb-3">
                                <label class="form-label fw-bold small"><i
                                        class="fa-solid fa-heading me-1 text-secondary"></i>タイトル名</label>
                                <input type="text" name="title" class="form-control" placeholder="例：Javaプログラミング">
                            </div>

                            <!-- 著者名 -->
                            <div class="mb-3">
                                <label class="form-label fw-bold small"><i
                                        class="fa-solid fa-user me-1 text-secondary"></i>著者名</label>
                                <input type="text" name="author" class="form-control" placeholder="例：山田太郎">
                            </div>

                            <!-- ジャンル選択 -->
                            <div class="mb-3">
                                <label class="form-label fw-bold small"><i
                                        class="fa-solid fa-layer-group me-1 text-secondary"></i>ジャンル選択</label>
                                <select name="genre" class="form-select">
                                    <option value="" selected>指定なし（すべてのジャンル）</option>
                                    <option value="tech">IT・技術書</option>
                                    <option value="novel">小説・文学</option>
                                    <option value="manga">漫画・コミック</option>
                                    <option value="business">ビジネス・実用書</option>
                                    <option value="other">その他</option>
                                </select>
                            </div>

                            <!-- キーワード・ISBN -->
                            <div class="mb-4">
                                <label class="form-label fw-bold small"><i
                                        class="fa-solid fa-key me-1 text-secondary"></i>フリーキーワード・ISBN</label>
                                <input type="text" name="keyword" class="form-control" placeholder="ISBNコードやメモの単語など">
                            </div>

                            <!-- 検索ボタン -->
                            <div class="d-grid gap-2 mb-3">
                                <button type="submit" class="btn btn-primary fw-bold py-2">
                                    <i class="fa-solid fa-magnifying-glass me-2"></i>所蔵書籍を検索する
                                </button>
                            </div>

                            <div class="text-center">
                                <a href="home_user.html" class="text-decoration-none small text-muted">
                                    <i class="fa-solid fa-arrow-left me-1"></i>ホームに戻る
                                    </button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- フッター -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 チーム開発書籍管理システム しょかんくん</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
