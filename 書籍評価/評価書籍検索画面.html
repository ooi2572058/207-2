<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>評価書籍検索 - 書籍管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
        }

        main {
            flex: 1;
        }

        .navbar {
            background-color: #2c3e50 !important;
        }

        .card-custom {
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .card-header-custom {
            background-color: #2c3e50;
            color: #fff;
            font-weight: bold;
            border-radius: 10px 10px 0 0 !important;
        }

        .footer {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-white" href="#"><i
                        class="fa-solid fa-book-open me-2 text-info"></i>書籍管理システム</a>
            </div>
        </nav>
    </header>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7">
                    <div class="card card-custom">
                        <div class="card-header card-header-custom py-3">
                            <h5 class="mb-0"><i class="fa-solid fa-star me-2"></i>レビューを書く書籍の検索</h5>
                        </div>
                        <div class="card-body p-4">
                            <p class="text-muted small mb-3">評価・レビューを登録したい所蔵書籍のタイトルを入力してください。</p>
                            <form>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">書籍タイトル <span
                                            class="badge bg-danger">必須</span></label>
                                    <div class="input-group input-group-lg">
                                        <input type="text" class="form-control" placeholder="例: Javaプログラミング入門"
                                            value="Java">
                                        <button type="button" class="btn btn-primary px-4"><i
                                                class="fa-solid fa-magnifying-glass me-1"></i> 所蔵検索</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 書籍管理システム All Rights Reserved.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
