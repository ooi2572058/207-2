<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検索結果一覧 - 書籍管理システム</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (アイコン) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        }

        main {
            flex: 1;
        }

        .navbar {
            background-color: #2c3e50 !important;
        }

        /* セクションヘッダー */
        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
            border-left: 4px solid #3498db;
            padding-left: 10px;
            margin-bottom: 0;
        }

        /* 書籍カード全体のデザイン（グリッド用） */
        .book-card {
            border: none;
            border-radius: 8px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            height: 100%;
            cursor: pointer;
        }

        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }

        /* 表紙画像枠 */
        .book-cover {
            height: 160px;
            border-radius: 6px 6px 0 0;
            object-fit: cover;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.12);
            background: linear-gradient(135deg, #34495e, #2c3e50);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.8rem;
            text-align: center;
            padding: 8px;
            position: relative;
        }

        /* タイトル文字列の省略処理 */
        .book-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* 評価（星）バッジ表示 */
        .rating-badge {
            font-size: 0.75rem;
            color: #f39c12;
            font-weight: bold;
            margin-top: 2px;
        }

        /* 0件の場合のメッセージボックス */
        .empty-message {
            background-color: #ffffff;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            padding: 30px;
            color: #64748b;
            font-size: 0.95rem;
            text-align: center;
        }

        .footer {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <nav class="navbar navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-white" href="book_list.html">
                    <i class="fa-solid fa-book-open me-2 text-info"></i>書籍管理システム
                </a>
                <div class="d-flex">
                    <a href="book_list.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-house me-1"></i>ホームへ戻る</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="py-4">
        <div class="container">

            <!-- 検索条件・ヒット件数表示エリア -->
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="section-title mb-1">「Java」の検索結果</h2>
                    <p class="text-muted small mb-0">検索キーワード・ジャンル条件に一致する書籍一覧です。</p>
                </div>
                <div class="mt-2 mt-md-0">
                    <span class="badge bg-primary p-2">ヒット件数: <strong>3</strong> 冊</span>
                </div>
            </div>

            <!-- 検索・フィルターバー（検索結果画面の上部で再検索可能） -->
            <div class="card p-3 mb-4 shadow-sm border-0">
                <form class="row g-3 align-items-center">
                    <div class="col-md-5">
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                            <input type="text" class="form-control" value="Java" placeholder="タイトル、著者名、ISBNで検索...">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select class="form-select">
                            <option value="">すべてのジャンル</option>
                            <option selected>プログラミング・Web開発</option>
                            <option>デザイン・フロントエンド</option>
                            <option>インフラ・データベース</option>
                            <option>セキュリティ</option>
                            <option>人工知能・AI</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-rotate me-1"></i>検索を更新</button>
                    </div>
                </form>
            </div>

            <!-- 【検索結果ありの場合】書籍カードグリッド一覧 -->
            <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3 mb-4">

                <!-- 書籍カード 1 -->
                <div class="col">
                    <div class="card book-card p-2 d-flex flex-column h-100">
                        <div class="book-cover">Javaプログラミング入門 第2版</div>
                        <div class="card-body p-2 d-flex flex-column">
                            <div class="book-title" title="Javaプログラミング入門 第2版">Javaプログラミング入門 第2版</div>
                            <div class="rating-badge"><i class="fa-solid fa-star"></i> 4.8</div>
                            <div class="mt-auto pt-2">
                                <a href="book_detail.html?id=1" class="btn btn-outline-primary btn-sm w-100 py-0" style="font-size: 0.75rem;">詳細を見る</a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 書籍カード 2 -->
                <div class="col">
                    <div class="card book-card p-2 d-flex flex-column h-100">
                        <div class="book-cover" style="background: linear-gradient(135deg, #f1c40f, #f39c12);">スッキリわかるJava入門 第3版</div>
                        <div class="card-body p-2 d-flex flex-column">
                            <div class="book-title" title="スッキリわかるJava入門 第3版">スッキリわかるJava入門 第3版</div>
                            <div class="rating-badge"><i class="fa-solid fa-star"></i> 4.9</div>
                            <div class="mt-auto pt-2">
                                <a href="book_detail.html?id=2" class="btn btn-outline-primary btn-sm w-100 py-0" style="font-size: 0.75rem;">詳細を見る</a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 書籍カード 3 -->
                <div class="col">
                    <div class="card book-card p-2 d-flex flex-column h-100">
                        <div class="book-cover" style="background: linear-gradient(135deg, #e74c3c, #c0392b);">オブジェクト指向で解く設計デザインパターン</div>
                        <div class="card-body p-2 d-flex flex-column">
                            <div class="book-title" title="オブジェクト指向で解く設計デザインパターン">オブジェクト指向で解く設計デザイン</div>
                            <div class="rating-badge"><i class="fa-solid fa-star"></i> 4.8</div>
                            <div class="mt-auto pt-2">
                                <a href="book_detail.html?id=3" class="btn btn-outline-primary btn-sm w-100 py-0" style="font-size: 0.75rem;">詳細を見る</a>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 【検索結果0件の場合の表示サンプル：コメントアウト】 -->
            <!--
            <div class="empty-message mb-4">
                <i class="fa-solid fa-circle-exclamation me-2 text-warning"></i>指定された条件に一致する書籍は見つかりませんでした。別のキーワードやジャンルでお試しください。
            </div>
            -->

            <!-- ページネーション -->
            <nav class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item disabled"><a class="page-link" href="#">前へ</a></li>
                    <li class="page-item active"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">次へ</a></li>
                </ul>
            </nav>

        </div>
    </main>

    <!-- フッター -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 書籍管理システム All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
