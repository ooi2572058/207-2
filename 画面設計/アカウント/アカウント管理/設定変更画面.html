<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィール編集 - しょかんくん</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (アイコン) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #18bc9c;
            --bg-light: #f8f9fa;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .navbar {
            background-color: var(--primary-color) !important;
        }

        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        /* アイコンプレビュー表示エリア */
        .profile-icon-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }

        .profile-icon-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--secondary-color);
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-size: 3rem;
        }

        .icon-upload-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background-color: var(--primary-color);
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid #ffffff;
            transition: background-color 0.2s;
        }

        .icon-upload-badge:hover {
            background-color: var(--secondary-color);
        }

        .footer {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <nav class="navbar navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold text-white" href="#">
                    <i class="fa-solid fa-book-open me-2 text-info"></i>しょかんくん
                </a>
            </div>
        </nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-9 col-lg-7">

                    <div class="card card-custom p-4 bg-white">
                        <div class="text-center mb-4">
                            <h4 class="fw-bold text-dark">
                                <i class="fa-solid fa-user-gear me-2 text-primary"></i>プロフィール編集
                            </h4>
                            <p class="text-muted small mb-0">アイコン画像や各種ご登録情報の変更・パスワードの更新が行えます</p>
                        </div>

                        <form action="profile_update.html" method="post" enctype="multipart/form-data">

                            <!-- アイコン画像変更エリア -->
                            <div class="text-center mb-4">
                                <div class="profile-icon-wrapper mb-3">
                                    <div class="profile-icon-img" id="iconPreview">
                                        <i class="fa-solid fa-user"></i>
                                    </div>
                                    <label for="iconInput" class="icon-upload-badge" title="アイコン画像を選択">
                                        <i class="fa-solid fa-camera"></i>
                                    </label>
                                    <input type="file" id="iconInput" name="icon" class="d-none" accept="image/*"
                                        onchange="previewImage(event)">
                                </div>
                                <span class="badge bg-light text-dark border">JPEG / PNG（最大 5MB）</span>
                            </div>

                            <div class="row">
                                <!-- 氏名（本名） -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold small">氏名（本名） <span class="badge bg-danger">必須</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
                                        <input type="text" name="fullname" class="form-control" value="中野 智樹"
                                            placeholder="例: 山田 太郎" required>
                                    </div>
                                </div>

                                <!-- ニックネーム（ユーザー名） -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold small">ニックネーム（ユーザー名） <span class="badge bg-danger">必須</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-user-tag"></i></span>
                                        <input type="text" name="username" class="form-control" value="しょかん太郎"
                                            placeholder="表示用ニックネーム" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <!-- メールアドレス -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold small">メールアドレス <span class="badge bg-danger">必須</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                        <input type="email" name="mailaddress" class="form-control" value="taro@example.com"
                                            placeholder="example@email.com" required>
                                    </div>
                                </div>

                                <!-- 電話番号 -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold small">電話番号 <span class="badge bg-danger">必須</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                                        <input type="tel" name="phone" class="form-control" value="090-1234-5678"
                                            placeholder="090-0000-0000" required>
                                    </div>
                                </div>
                            </div>

                            <!-- 住所（任意に変更） -->
                            <div class="mb-3">
                                <label class="form-label fw-bold small">住所 <span class="badge bg-secondary">任意</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-location-dot"></i></span>
                                    <input type="text" name="address" class="form-control" value="大分県大分市生石町 2-1-1"
                                        placeholder="都道府県・市区町村・番地・建物名">
                                </div>
                            </div>

                            <!-- 所属法人（表示のみ） -->
                            <div class="mb-3">
                                <label class="form-label fw-bold small">所属法人（組織）</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-building"></i></span>
                                    <input type="text" class="form-control bg-light" value="株式会社テックブックス" readonly>
                                </div>
                                <div class="form-text small text-muted">※所属法人の変更をご希望の場合は、各法人へお問い合わせください。</div>
                            </div>

                            <!-- パスワード変更セクション -->
                            <hr class="my-4">
                            <h5 class="fw-bold text-dark fs-6 mb-3"><i class="fa-solid fa-lock me-2 text-primary"></i>パスワードの変更</h5>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">新しいパスワード（変更する場合のみ入力）</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                                    <input type="password" name="new_password" class="form-control" placeholder="8文字以上の半角英数字・記号">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold small">新しいパスワード（確認）</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                                    <input type="password" name="new_password_confirm" class="form-control" placeholder="もう一度入力してください">
                                </div>
                            </div>

                            <!-- 変更確定の本人確認（現在のパスワード） -->
                            <div class="card bg-light p-3 mb-4 border">
                                <div class="mb-0">
                                    <label class="form-label fw-bold small text-danger">現在のパスワード <span class="badge bg-danger">変更確定に必須</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
                                        <input type="password" name="current_password" class="form-control" placeholder="変更を確定するため入力してください" required>
                                    </div>
                                    <div class="form-text small text-muted">※プロフィール情報の更新、またはパスワード変更を保存するには現在のパスワードが必要です。</div>
                                </div>
                            </div>

                            <!-- 自己紹介・メモ -->
                            <div class="mb-4">
                                <label class="form-label fw-bold small">自己紹介・ひとこと（任意）</label>
                                <textarea name="bio" class="form-control" rows="3"
                                    placeholder="読みたい本や好きなジャンルなどを記入できます">技術書を中心に読んでいます。よろしくお願いします！</textarea>
                            </div>

                            <!-- 保存・キャンセルボタン -->
                            <div class="d-grid gap-2 mb-3">
                                <button type="submit" class="btn btn-primary fw-bold py-2">
                                    <i class="fa-solid fa-floppy-disk me-2"></i>変更内容を保存する
                                </button>
                                <a href="javascript:history.back()" class="btn btn-outline-secondary">
                                    キャンセルして戻る
                                </a>
                            </div>

                            <!-- アカウント削除への誘導リンク -->
                            <div class="text-center mt-4 pt-3 border-top">
                                <a href="account_delete.html" class="text-danger small text-decoration-none">
                                    <i class="fa-solid fa-user-xmark me-1"></i>アカウントを削除（退会）したい場合はこちら
                                </a>
                            </div>

                        </form>

                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- フッター -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 チーム開発書籍管理システム しょかんくん</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 画像プレビュー用JavaScript -->
    <script>
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const preview = document.getElementById('iconPreview');
                    preview.innerHTML = `<img src="${e.target.result}" alt="Preview" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                }
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>

</html>
