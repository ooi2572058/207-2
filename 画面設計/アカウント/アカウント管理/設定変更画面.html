<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィール編集 - しょかんくん</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (アイコン) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #18bc9c;
            --bg-light: #f8f9fa;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .navbar {
            background-color: var(--primary-color) !important;
        }

        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        /* アイコンプレビュー表示エリア */
        .profile-icon-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }

        .profile-icon-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--secondary-color);
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-size: 3rem;
        }

        .icon-upload-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background-color: var(--primary-color);
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid #ffffff;
            transition: background-color 0.2s;
        }

        .icon-upload-badge:hover {
            background-color: var(--secondary-color);
        }

        .footer {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <nav class="navbar navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold text-white" href="#">
                    <i class="fa-solid fa-book-open me-2 text-info"></i>しょかんくん
                </a>
            </div>
        </nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-9 col-lg-7">

                    <div class="card card-custom p-4 bg-white">
                        <div class="text-center mb-4">
                            <h4 class="fw-bold text-dark">
                                <i class="fa-solid fa-user-gear me-2 text-primary"></i>プロフィール編集
                            </h4>
                            <p class="text-muted small mb-0">アイコン画像や各種ご登録情報の変更・パスワードの更新が行えます</p>
                        </div>

                        <form action="profile_update.html" method="post" enctype="multipart/form-data">

                            <!-- アイコン画像変更エリア -->
                            <div class="text-center mb-4">
                                <div class="profile-icon-wrapper mb-3">
                                    <div class="profile-icon-img" id="iconPreview">
                                        <i class="fa-solid fa-user"></i>
                                    </div>
                                    <label for="iconInput" class="icon-upload-badge" title="アイコン画像を選択">
                                        <i class="fa-solid fa-camera"></i>
                                    </label>
                                    <input type="file" id="iconInput" name="icon" class="d-none" accept="image/*"
                                        onchange="previewImage(event)">
                                </div>
                                <span class="badge bg-light text-dark border">JPEG / PNG（最大 5MB）</span>
                            </div>

                            <div class="row">
                                <!-- 氏名（本名） -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold small">氏名（本名） <span class="badge bg-danger">必須</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
                                        <input type="text" name="fullname" class="form-control" value=""
                                            placeholder="例: 山田 太郎" required>
                                    </div>
                                </div>

                                <!-- ニックネーム（ユーザー名） -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold small">ニックネーム（ユーザー名） <span class="badge bg-danger">必須</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-user-tag"></i></span>
                                        <input type="text" name="username" class="form-control" value=""
                                            placeholder="表示用ニックネーム" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <!-- メールアドレス -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold small">メールアドレス <span class="badge bg-danger">必須</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                        <input type="email" name="mailaddress" class="form-control" value=""
                                            placeholder="example@email.com" required>
                                    </div>
                                </div>

                                <!-- 電話番号 -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold small">電話番号 <span class="badge bg-danger">必須</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                                        <input type="tel" name="phone" class="form-control" value=""
                                            placeholder="090-0000-0000" required>
                                    </div>
                                </div>
                            </div>

                            <!-- 住所欄（JS連動セレクトボックス＆郵便番号検索対応・初期値空） -->
                            <div class="card bg-light p-3 mb-3 border">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <label class="form-label fw-bold small text-secondary mb-0">
                                        <i class="fa-solid fa-location-dot me-1"></i> 住所情報 <span class="badge bg-secondary">任意</span>
                                    </label>
                                    <span id="zipStatus" class="small text-muted"></span>
                                </div>
                                
                                <div class="row">
                                    <!-- 郵便番号 -->
                                    <div class="col-md-4 mb-3">
                                        <label for="postalCode" class="form-label text-muted" style="font-size: 0.75rem;">郵便番号（自動入力対応）</label>
                                        <div class="input-group input-group-sm">
                                            <span class="input-group-text"><i class="fa-solid fa-envelope-open-text"></i></span>
                                            <input type="text" id="postalCode" name="postal_code" class="form-control" value="" placeholder="例: 870-0024" maxlength="8">
                                            <button type="button" class="btn btn-outline-primary" id="zipSearchBtn" title="郵便番号から住所を検索">
                                                <i class="fa-solid fa-magnifying-glass"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- 都道府県（JSで全47都道府県を生成・未選択状態） -->
                                    <div class="col-md-4 mb-3">
                                        <label for="prefectureSelect" class="form-label text-muted" style="font-size: 0.75rem;">都道府県</label>
                                        <select class="form-select form-select-sm" id="prefectureSelect" name="prefecture">
                                            <option value="" selected>都道府県を選択</option>
                                        </select>
                                    </div>

                                    <!-- 市（都道府県に応じてJSで動的生成・未選択状態） -->
                                    <div class="col-md-4 mb-3">
                                        <label for="citySelect" class="form-label text-muted" style="font-size: 0.75rem;">市（市区町村）</label>
                                        <select class="form-select form-select-sm" id="citySelect" name="city">
                                            <option value="" selected>市区町村を選択</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- 番地・町名、建物名、部屋番 -->
                                <div class="mb-0">
                                    <label for="addressDetails" class="form-label text-muted" style="font-size: 0.75rem;">番地・町名、建物名、部屋番</label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text"><i class="fa-solid fa-house"></i></span>
                                        <input type="text" id="addressDetails" name="address_details" class="form-control" value="" placeholder="例: 生石町 2-1-1 〇〇ビル 201号室">
                                    </div>
                                </div>
                            </div>

                            <!-- 所属法人（未設定状態） -->
                            <div class="mb-3">
                                <label class="form-label fw-bold small">所属法人（組織）</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-building"></i></span>
                                    <input type="text" class="form-control bg-light" value="" placeholder="未所属" readonly>
                                </div>
                                <div class="form-text small text-muted">※所属法人の変更をご希望の場合は、各法人へお問い合わせください。</div>
                            </div>

                            <!-- パスワード変更セクション -->
                            <hr class="my-4">
                            <h5 class="fw-bold text-dark fs-6 mb-3"><i class="fa-solid fa-lock me-2 text-primary"></i>パスワードの変更</h5>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">新しいパスワード（変更する場合のみ入力）</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                                    <input type="password" name="new_password" class="form-control" value="" placeholder="8文字以上の半角英数字・記号">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold small">新しいパスワード（確認）</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                                    <input type="password" name="new_password_confirm" class="form-control" value="" placeholder="もう一度入力してください">
                                </div>
                            </div>

                            <!-- 変更確定の本人確認（現在のパスワード） -->
                            <div class="card bg-light p-3 mb-4 border">
                                <div class="mb-0">
                                    <label class="form-label fw-bold small text-danger">現在のパスワード <span class="badge bg-danger">変更確定に必須</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
                                        <input type="password" name="current_password" class="form-control" value="" placeholder="変更を確定するため入力してください" required>
                                    </div>
                                    <div class="form-text small text-muted">※プロフィール情報の更新、またはパスワード変更を保存するには現在のパスワードが必要です。</div>
                                </div>
                            </div>

                            <!-- 自己紹介・メモ -->
                            <div class="mb-4">
                                <label class="form-label fw-bold small">自己紹介・ひとこと（任意）</label>
                                <textarea name="bio" class="form-control" rows="3"
                                    placeholder="読みたい本や好きなジャンルなどを記入できます"></textarea>
                            </div>

                            <!-- 保存・キャンセルボタン -->
                            <div class="d-grid gap-2 mb-3">
                                <button type="submit" class="btn btn-primary fw-bold py-2">
                                    <i class="fa-solid fa-floppy-disk me-2"></i>変更内容を保存する
                                </button>
                                <a href="javascript:history.back()" class="btn btn-outline-secondary">
                                    キャンセルして戻る
                                </a>
                            </div>

                            <!-- アカウント削除への誘導リンク -->
                            <div class="text-center mt-4 pt-3 border-top">
                                <a href="account_delete.html" class="text-danger small text-decoration-none">
                                    <i class="fa-solid fa-user-xmark me-1"></i>アカウントを削除（退会）したい場合はこちら
                                </a>
                            </div>

                        </form>

                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- フッター -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 チーム開発書籍管理システム しょかんくん</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

            const file = event.target.files[0];

                    const preview = document.getElementById('iconPreview');
                    preview.innerHTML = `<img src="${e.target.result}" alt="Preview" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                }
                reader.readAsDataURL(file);
            }
        }

        const prefSelect = document.getElementById('prefectureSelect');
        const citySelect = document.getElementById('citySelect');
        const postalInput = document.getElementById('postalCode');
        const addressDetailsInput = document.getElementById('addressDetails');
        const zipStatus = document.getElementById('zipStatus');

        // 都道府県セレクトボックスの初期化（初期選択なし）
        function initPrefectures() {
            PREFECTURES.forEach(pref => {
                const option = document.createElement('option');
                option.value = pref;
                option.textContent = pref;
                prefSelect.appendChild(option);
            });
        }

        // 選択された都道府県に応じて市区町村セレクトボックスを更新
        async function updateCities(prefName, targetCity = "") {
            if (!prefName) {
                citySelect.innerHTML = '<option value="" selected>市区町村を選択</option>';
                return;
            }

            citySelect.innerHTML = '<option value="">読み込み中...</option>';

            let cities = [];
            try {
                const res = await fetch(`https://geoapi.heartrails.com/api/json?method=getCities&prefecture=${encodeURIComponent(prefName)}`);
                const data = await res.json();
                if (data.response && data.response.location) {
                    cities = data.response.location.map(item => item.city);
                }
            } catch (e) {
                cities = CITIES_BY_PREF[prefName] || [];
            }

            if (cities.length === 0) {
                cities = CITIES_BY_PREF[prefName] || [];
            }

            if (targetCity && !cities.includes(targetCity)) {
                cities.unshift(targetCity);
            }

            citySelect.innerHTML = '<option value="">市区町村を選択</option>';
            cities.forEach(city => {
                const option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                if (city === targetCity) option.selected = true;
                citySelect.appendChild(option);
            });
        }

        // 都道府県変更イベント
        prefSelect.addEventListener('change', function () {
            updateCities(this.value);
        });

        // 郵便番号検索機能（zipcloud APIを利用）
        async function searchAddressByZip() {
            const rawZip = postalInput.value.replace(/[^0-9]/g, '');
            if (rawZip.length !== 7) {
                zipStatus.innerHTML = '<span class="text-danger">※7桁の数字を入力してください</span>';
                return;
            }

            postalInput.value = `${rawZip.slice(0, 3)}-${rawZip.slice(3)}`;
            zipStatus.innerHTML = '<span class="text-primary"><i class="fa-solid fa-spinner fa-spin me-1"></i>検索中...</span>';

            try {
                const res = await fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${rawZip}`);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    const result = data.results[0];
                    const pref = result.address1;
                    const city = result.address2;
                    const town = result.address3;

                    prefSelect.value = pref;
                    await updateCities(pref, city);
                    addressDetailsInput.value = town;
                    zipStatus.innerHTML = '<span class="text-success"><i class="fa-solid fa-check me-1"></i>住所を反映しました</span>';
                } else {
                    zipStatus.innerHTML = '<span class="text-danger">該当する住所が見つかりませんでした</span>';
                }
            } catch (error) {
                zipStatus.innerHTML = '<span class="text-danger">住所の取得に失敗しました</span>';
            }
        }

        document.getElementById('zipSearchBtn').addEventListener('click', searchAddressByZip);
        postalInput.addEventListener('input', function () {
            const digits = this.value.replace(/[^0-9]/g, '');
            if (digits.length === 7) {
                searchAddressByZip();
            }
        });

        // ページ読み込み時はすべての項目が空・未選択の状態で初期化
        document.addEventListener('DOMContentLoaded', () => {
            initPrefectures();
        });
    </script>
