<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィール編集 - しょかんくん</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (アイコン) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #18bc9c;
            --bg-light: #f8f9fa;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .navbar {
            background-color: var(--primary-color) !important;
        }

        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        /* アイコンプレビュー表示エリア */
        .profile-icon-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }

        .profile-icon-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--secondary-color);
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-size: 3rem;
        }

        .icon-upload-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background-color: var(--primary-color);
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid #ffffff;
            transition: background-color 0.2s;
        }

        .icon-upload-badge:hover {
            background-color: var(--secondary-color);
        }

        .footer {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <nav class="navbar navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold text-white" href="#">
                    <i class="fa-solid fa-book-open me-2 text-info"></i>しょかんくん
                </a>
            </div>
        </nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">

                    <div class="card card-custom p-4 bg-white">
                        <div class="text-center mb-4">
                            <h4 class="fw-bold text-dark"><i
                                    class="fa-solid fa-user-gear me-2 text-primary"></i>プロフィール編集</h4>
                            <p class="text-muted small mb-0">アイコン画像やご登録情報の変更が行えます</p>
                        </div>

                        <form action="profile_update.html" method="post" enctype="multipart/form-data">

                            <!-- アイコン画像変更エリア -->
                            <div class="text-center mb-4">
                                <div class="profile-icon-wrapper mb-3">
                                    <!-- デフォルトアイコン（画像がある場合は img タグに変更可能） -->
                                    <div class="profile-icon-img" id="iconPreview">
                                        <i class="fa-solid fa-user"></i>
                                    </div>
                                    <!-- カメラバッジ（クリックでファイル選択） -->
                                    <label for="iconInput" class="icon-upload-badge" title="アイコン画像を選択">
                                        <i class="fa-solid fa-camera"></i>
                                    </label>
                                    <input type="file" id="iconInput" name="icon" class="d-none" accept="image/*"
                                        onchange="previewImage(event)">
                                </div>
                                <span class="badge bg-light text-dark border">JPEG / PNG（最大 5MB）</span>
                            </div>

                            <!-- ユーザー名 -->
                            <div class="mb-3">
                                <label class="form-label fw-bold small">ユーザー名 <span
                                        class="badge bg-danger">必須</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" name="username" class="form-control" value="しょかん太郎"
                                        placeholder="ユーザー名を入力" required>
                                </div>
                            </div>

                            <!-- メールアドレス -->
                            <div class="mb-3">
                                <label class="form-label fw-bold small">メールアドレス <span
                                        class="badge bg-danger">必須</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                    <input type="email" name="mailaddress" class="form-control" value="taro@example.com"
                                        placeholder="example@email.com" required>
                                </div>
                            </div>

                            <!-- 自己紹介・メモ（任意） -->
                            <div class="mb-4">
                                <label class="form-label fw-bold small">自己紹介・ひとこと（任意）</label>
                                <textarea name="bio" class="form-control" rows="3"
                                    placeholder="読みたい本や好きなジャンルなどを記入できます">技術書を中心に読んでいます。よろしくお願いします！</textarea>
                            </div>

                            <!-- 保存・キャンセルボタン -->
                            <div class="d-grid gap-2 mb-3">
                                <button type="submit" class="btn btn-primary fw-bold py-2">
                                    <i class="fa-solid fa-floppy-disk me-2"></i>変更内容を保存する
                                </button>
                                <a href="javascript:history.back()" class="btn btn-outline-secondary">
                                    キャンセルして戻る
                                </a>
                            </div>

                            <!-- アカウント削除への誘導リンク -->
                            <div class="text-center mt-4 pt-3 border-top">
                                <a href="account_delete.html" class="text-danger small text-decoration-none">
                                    <i class="fa-solid fa-user-xmark me-1"></i>アカウントを削除（退会）したい場合はこちら
                                </a>
                            </div>

                        </form>

                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- フッター -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 チーム開発書籍管理システム しょかんくん</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 画像プレビュー用JavaScript -->
    <script>
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const preview = document.getElementById('iconPreview');
                    preview.innerHTML = `<img src="${e.target.result}" alt="Preview" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                }
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>

</html>
