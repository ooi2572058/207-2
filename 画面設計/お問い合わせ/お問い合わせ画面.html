<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ - しょかんくん</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (アイコン) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #18bc9c;
            --bg-light: #f8f9fa;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .navbar {
            background-color: var(--primary-color) !important;
        }

        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .category-card {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-card:hover {
            border-color: #0d6efd;
            background-color: #f0f7ff;
        }

        .form-check-input:checked+.form-check-label {
            font-weight: bold;
            color: #0d6efd;
        }

        .footer {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- ヘッダー (ログイン済み状態) -->
    <header>
        <nav class="navbar navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-white" href="home_user.html">
                    <i class="fa-solid fa-book-open me-2 text-info"></i>しょかんくん
                </a>
                <div class="d-flex align-items-center">
                    <span class="text-white small me-3">
                        <i class="fa-solid fa-user-check me-1 text-info"></i>山田 太郎 さん
                    </span>
                    <a href="home_user.html" class="btn btn-outline-light btn-sm">
                        <i class="fa-solid fa-house me-1"></i>ホームに戻る
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="py-5">
        <div class="container">

            <!-- パンくずリスト導線 -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb small">
                    <li class="breadcrumb-item"><a href="home_user.html" class="text-decoration-none">ホーム</a></li>
                    <li class="breadcrumb-item active" aria-current="page">お問い合わせ</li>
                </ol>
            </nav>

            <div class="row justify-content-center">
                <div class="col-md-9 col-lg-7">

                    <div class="card card-custom bg-white p-4">
                        <div class="text-center mb-4">
                            <h4 class="fw-bold text-dark">
                                <i class="fa-envelope fa-solid me-2 text-primary"></i>お問い合わせ
                            </h4>
                            <p class="text-muted small mb-0">
                                システムの不具合やご意見・ご質問などを送信していただけます。<br>
                                内容を確認の上、登録されたメールアドレス宛にサポート担当よりご案内いたします。
                            </p>
                        </div>

                        <!-- 問い合わせフォーム -->
                        <form action="contact_complete.html" method="post">

                            <!-- 1. 送信元ユーザー情報確認表示 -->
                            <div class="alert alert-light border small mb-4">
                                <div class="row">
                                    <div class="col-sm-6 mb-1 mb-sm-0">
                                        <i class="fa-solid fa-user me-1 text-secondary"></i><strong>送信者:</strong> 山田 太郎
                                    </div>
                                    <div class="col-sm-6">
                                        <i class="fa-solid fa-envelope me-1 text-secondary"></i><strong>返信先メール:</strong>
                                        taro@example.com
                                    </div>
                                </div>
                            </div>

                            <!-- 2. お問い合わせ種別（ラジオボタン選択） -->
                            <div class="mb-4">
                                <label class="form-label fw-bold small">
                                    お問い合わせ種別 <span class="badge bg-danger ms-1">必須</span>
                                </label>

                                <div class="category-card">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="contact_category" id="cat1"
                                            value="bug" required checked>
                                        <label class="form-check-label w-100" for="cat1">
                                            <i
                                                class="fa-solid fa-triangle-exclamation text-danger me-2"></i>システムの不具合、エラー
                                        </label>
                                    </div>
                                </div>

                                <div class="category-card">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="contact_category" id="cat2"
                                            value="complaint">
                                        <label class="form-check-label w-100" for="cat2">
                                            <i class="fa-solid fa-face-frown text-warning me-2"></i>機能への不満・改善のご要望
                                        </label>
                                    </div>
                                </div>

                                <div class="category-card">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="contact_category" id="cat3"
                                            value="question">
                                        <label class="form-check-label w-100" for="cat3">
                                            <i class="fa-solid fa-circle-question text-info me-2"></i>機能のわからないこと（使い方）
                                        </label>
                                    </div>
                                </div>

                                <div class="category-card">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="contact_category" id="cat4"
                                            value="other">
                                        <label class="form-check-label w-100" for="cat4">
                                            <i class="fa-solid fa-ellipsis text-secondary me-2"></i>その他
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- 3. 詳細入力（テキストエリア） -->
                            <div class="mb-4">
                                <label for="contactDetail" class="form-label fw-bold small">
                                    お問い合わせ詳細 <span class="badge bg-danger ms-1">必須</span>
                                </label>
                                <textarea name="contact_detail" id="contactDetail" class="form-control" rows="6"
                                    maxlength="1000" required
                                    placeholder="不具合が発生した画面や具体的な状況、またはご意見・ご質問の詳細をご記入ください。（最大1000文字）"></textarea>
                                <div class="text-end form-text small"><span id="charCount">0</span> / 1000文字</div>
                            </div>

                            <!-- ボタンエリア -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary fw-bold py-2">
                                    <i class="fa-solid fa-paper-plane me-1"></i>お問い合わせを送信する
                                </button>
                                <a href="home_user.html" class="btn btn-outline-secondary py-2">
                                    <i class="fa-solid fa-house me-1"></i>ホームに戻る
                                </a>
                            </div>

                        </form>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- フッター -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 チーム開発書籍管理システム しょかんくん</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 文字数カウント処理 -->
    <script>
        const detailTextarea = document.getElementById('contactDetail');
        const charCount = document.getElementById('charCount');

        detailTextarea.addEventListener('input', function () {
            charCount.textContent = this.value.length;
        });
    </script>
</body>

</html>
